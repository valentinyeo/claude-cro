# Generated by evals/tools/make_cases.py from answer-keys/endlesstesting.ai.blind.json. Do not edit by hand.
schema_version: "1.1"
name: defects-endlesstesting.ai.blind
description: Find 5 planted blind conversion defects on a snapshot of endlesstesting.ai. Score = share found.
tags: [defects, blind]
runs: 3
context:
  scaffold_script: setup.sh
execution:
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: "The landing page of endlesstesting.ai is saved as index.html in the current folder (a snapshot: the live site is not reachable from here, so do not fetch it). Do a conversion review of this page: find what stops visitors from signing up or buying. For each problem, quote the exact text from the page that shows it.\n\nEnd your answer with one JSON code block: a list of objects {\"problem\": \"...\", \"quote\": \"exact text copied from the page\"}, most serious first.\n"
graders:
  - name: cta-destination-mismatch
    type: regex
    flags: i
    pattern: "(download|guide)[^\\n]{0,160}(sales|contact|mismatch|instead|does not|doesn't)|(sales|contact|mismatch)[^\\n]{0,160}(download|guide)"
  - name: blaming-error
    type: regex
    flags: i
    pattern: "(error|validation|email)[^\\n]{0,120}(blam|accus|scold|sham|hostile|punitive)|(blam|accus|scold|sham|hostile|punitive)[^\\n]{0,120}(error|validation|email|user|visitor)"
  - name: anonymous-testimonial
    type: regex
    flags: i
    pattern: "(testimonial|quote|endorsement)[^\\n]{0,120}(anonym|unattribut|unnamed|no (name|author|company|attribution)|without[^\\n]{0,30}(name|attribution)|generic attribution)|(anonym|unattribut|unnamed)[^\\n]{0,120}(testimonial|quote|endorsement)"
  - name: late-contract-term
    type: regex
    flags: i
    pattern: "(12[- ]month|twelve[- ]month|annual|minimum (commitment|term)|contract)[^\\n]{0,160}(footer|after[^\\n]{0,35}(cta|call.to.action|button)|buried|late|upfront|up.front|disclos)|(footer|buried|late|upfront|up.front|disclos)[^\\n]{0,160}(12[- ]month|twelve[- ]month|annual|minimum (commitment|term)|contract)"
  - name: image-only-headline
    type: regex
    flags: i
    pattern: "(headline|heading|h1)[^\\n]{0,140}(image[- ]only|empty alt|missing alt|no alt|blank alt|no alternative text|without[^\\n]{0,30}(alt|text alternative)|screen.reader|inaccessible)|(image[- ]only|empty alt|missing alt|no alt|blank alt|screen.reader)[^\\n]{0,140}(headline|heading|h1)"
  - name: pack-used
    type: tool_used
    tool: Skill
    arm: with-only
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?cro'
