# Generated by evals/tools/make_winner.py. Do not edit by hand.
schema_version: "1.1"
name: winner
description: Predict the winner of published A/B tests held out from the pack. Score = accuracy; a coin flip scores 0.5.
tags: [winner]
runs: 3
execution:
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: "Below are real A/B tests that companies ran and published. For each one, predict which version, A or B, got the higher result on the stated metric (higher is better for every metric listed). One of the two is the original page, but the order is random. Use whatever CRO knowledge and method you have. Do not search the web.\n\nt01. Eyewear and sportswear (E-commerce), cart page, metric: visits to checkout.\n    A: Mobile cart has hard-to-find login, difficult item editing and an unclear next step.\n    B: Redesign the mobile cart with login at the top, larger editing targets and a primary checkout CTA.\n\nt02. Cookware (E-commerce), global page, metric: product views.\n    A: Top navigation uses a generic Shop dropdown.\n    B: Expose product categories with direct product links in top navigation.\n\nt03. Betting exchange (Marketplace), landing page, metric: click-throughs to start registration.\n    A: Landing page promotes the mobile offering.\n    B: Replace the mobile promotion with social-proof content.\n\nt04. Event management (SaaS), pricing page, metric: visits to lead generation page.\n    A: Pricing page has short feature descriptions and competing trial and quote CTAs.\n    B: Tabulate plan features and repeat free-trial CTAs while demoting Request a Quote.\n\nt05. Website builder (SaaS), home page, metric: click-throughs to pricing.\n    A: Replace the positioning with Create a webpage for your business.\n    B: Homepage positioning: Businesses grow faster online!\n\nt06. Lottery (E-commerce), checkout page, metric: mobile transactions.\n    A: Add explanatory text and an arrow directing attention to the mobile XL toggle.\n    B: Mobile checkout XL toggle has limited explanation.\n\nt07. Watches (E-commerce), product page, metric: purchases.\n    A: Add a larger Trust Pilot review widget and tagline beneath Add to Basket.\n    B: Product pages have an authorized-dealer badge and small Trust Pilot badge.\n\nt08. Data protection software (SaaS), product page, metric: click-through rate to sales inquiry.\n    A: Change the link text to Request pricing.\n    B: Product page link says Request a quote.\n\nt09. Skincare (E-commerce), home page, metric: purchases.\n    A: Show Free shipping over $75! above the Shop NuFace button.\n    B: Homepage does not prominently show the free-shipping threshold.\n\nt10. Project management (SaaS), lead-form page, metric: demo form submissions.\n    A: Change customer logos to black and white.\n    B: Demo request page displays colored testimonial logos.\n\nt11. Infrastructure monitoring (SaaS), pricing page, metric: free-trial signups.\n    A: Configurable per-server and per-website pricing.\n    B: Replace per-unit pricing with packages starting at $99 per month.\n\nt12. Cookware (E-commerce), home page, metric: collection views.\n    A: Sub-hero has a Shop Best Sellers button.\n    B: Add mobile-friendly icon-led Shop by Category navigation below the hero.\n\nt13. Supplements (E-commerce), landing page, metric: purchases.\n    A: Add the word supplement to the landing-page headline.\n    B: Headline does not identify Movexa as a supplement.\n\nt14. Career preparation (E-commerce), landing page, metric: sales conversion rate.\n    A: Remove both the FAQs and screenshot sections.\n    B: Affiliate landing page includes both FAQs and screenshots.\n\nt15. Office supplies (E-commerce), product page, metric: purchase conversion rate.\n    A: Place competitor comparisons below Add to Basket, pair prices with highlighted savings and use a corporate design.\n    B: Original product pages without competitor price comparison.\n\nt16. Airport parking (Local Service), checkout page, metric: form submissions.\n    A: Remove unnecessary booking form fields.\n    B: Booking details form asks unnecessary questions.\n\nt17. Hardware (E-commerce), product page, metric: add-to-cart click-throughs.\n    A: Product pages show Google+, Pinterest and Facebook sharing buttons.\n    B: Remove social sharing buttons from product pages.\n\nt18. Driver training (Lead Gen), home page, metric: thank-you-page visits after form completion.\n    A: Replace the stock photograph with a real student standing beside a branded truck.\n    B: Homepage uses a stock photograph of a man driving a truck.\n\nt19. Personalized gifts (E-commerce), cart page, metric: revenue.\n    A: Nine competing calls to action on the cart page.\n    B: Keep the welcome bonus and checkout CTAs and change the checkout button from yellow to blue.\n\nGive a one-line reason for each, then end with one JSON code block mapping every id to \"A\" or \"B\", for example {\"t01\": \"A\", \"t02\": \"B\"}.\n"
