  prompt: "Below are real A/B tests that companies ran and published. For each one, predict which version, A or B, got the higher result on the stated metric (higher is better for every metric listed). One of the two is the original page, but the order is random. Use whatever CRO knowledge and method you have. Do not search the web.\n\nt01. International product business (Subscription), landing page, metric: overall order conversion rate.\n    A: Signup/purchase page does not mention the charitable donation.\n    B: Add donation-information banner at the top before the signup breakdown.\n\nt02. Luxury apparel (E-commerce), product page, metric: revenue per session.\n    A: Add a review-star summary near the top of each PDP.\n    B: Product reviews exist at the bottom but no star-rating summary near the top of the PDP.\n\nt03. Marketing conferences (Lead Gen), email page, metric: unique email clickthrough per delivered email.\n    A: (Open BEFORE Christmas) Email Summit 2014: discount ends Jan 9th\n    B: Use subject line $300 Savings | Vegas | More ROI From Email In 2014.\n\nt04. Hardware (E-commerce), product page, metric: add-to-cart click-throughs.\n    A: Remove social sharing buttons from product pages.\n    B: Product pages show Google+, Pinterest and Facebook sharing buttons.\n\nt05. Used mobile phones (Marketplace), home page, metric: CTA click-through rate.\n    A: Green CTA button with black text.\n    B: Change the text on the green CTA button from black to yellow.\n\nt06. Music lessons (Lead Gen), landing page, metric: conversions.\n    A: Use a cliffhanger headline modeled on John Caples\u2019s They Laughed When I Sat Down at the Piano formula.\n    B: Existing guitar-lesson landing-page headline.\n\nt07. Cookware (E-commerce), home page, metric: collection views.\n    A: Sub-hero has a Shop Best Sellers button.\n    B: Add mobile-friendly icon-led Shop by Category navigation below the hero.\n\nt08. Infrastructure monitoring (SaaS), pricing page, metric