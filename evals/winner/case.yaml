obile transactions.\n    A: Add explanatory text and an arrow directing attention to the mobile XL toggle.\n    B: Mobile checkout XL toggle has limited explanation.\n\nt62. Handbag affiliate shopping (E-commerce), landing page, metric: click-throughs to affiliate partner websites.\n    A: Original search page before the tested additional badge.\n    B: Add the Versign Seal (the source\u2019s spelling for the security seal) to the search page.\n\nt63. Prescription eyewear (E-commerce), home page, metric: Fit Profile quiz starts.\n    A: Original brand-aligned hero unit and Get Started CTA.\n    B: Show the actual home try-on Fit Kit, add three process steps and replace CTA with Start Fit Profile.\n\nt64. Web browsers (Non-profit), landing page, metric: Firefox download conversions.\n    A: Pages without the main features box.\n    B: Include the main features box.\n\nt65. Web browsers (Non-profit), product page, metric: Firefox downloads.\n    A: Green Firefox download button.\n    B: Replace the green Firefox download button with a orange button.\n\nt66. Banking (Lead Gen), lead-form page, metric: leads.\n    A: Standard request form with mandatory business identification number field.\n    B: Add a pop-up explaining the mandatory business identification number field.\n\nt67. Wi-Fi analysis software (E-commerce), product page, metric: download-page clicks or engagement.\n    A: Text-link-dominant inSSIDer download page, with a free Home download and separate Office flow.\n    B: Use buttons, explanatory headers and enlarged transaction areas with forms; also position Home as a paid product with a trial and lead capture.\n\nt68. Betting exchange (Marketplace), landing page, metric: click-throughs to start registration.\n    A: Landing page promotes the mobile offering.\n    B: Replace the mobile promotion with social-proof content.\n\nt69. Airport parking (Local Service), checkout page, metric: form submissions.\n    A: Remove unnecessary booking form fields.\n    B