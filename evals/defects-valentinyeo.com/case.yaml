# Generated by evals/tools/make_cases.py from answer-keys/valentinyeo.com.json. Do not edit by hand.
schema_version: "1.1"
name: defects-valentinyeo.com
description: Find 5 planted planted conversion defects on a snapshot of valentinyeo.com. Score = share found.
tags: [defects, planted]
runs: 3
context:
  scaffold_script: setup.sh
execution:
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: "The landing page of valentinyeo.com is saved as index.html in the current folder (a snapshot: the live site is not reachable from here, so do not fetch it). Do a conversion review of this page: find what stops visitors from signing up or buying. For each problem, quote the exact text from the page that shows it.\n\nEnd your answer with one JSON code block: a list of objects {\"problem\": \"...\", \"quote\": \"exact text copied from the page\"}, most serious first.\n"
graders:
  - name: vague-cta
    type: regex
    flags: i
    pattern: "[\\\"'\u201c\u2018]Submit[\\\"'\u201d\u2019]"
  - name: meaningless-headline
    type: regex
    flags: i
    pattern: "Welcome to our website"
  - name: long-form
    type: regex
    flags: i
    pattern: "\\b(9|nine)\\b[^\\n]{0,40}(fields?|inputs?|questions?)|(fields?|inputs?)[^\\n]{0,40}\\b(9|nine)\\b|date of birth"
  - name: fake-urgency
    type: regex
    flags: i
    pattern: "only 3 spots|spots left|00:14:59|offer ends in|fake urgency|false urgency|countdown"
  - name: conflicting-prices
    type: regex
    flags: i
    pattern: "^(?=[\\s\\S]*\\$49)(?=[\\s\\S]*\\$79)"
  - name: pack-used
    type: tool_used
    tool: Skill
    arm: with-only
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?cro'
