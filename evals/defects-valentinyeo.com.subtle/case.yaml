# Generated by evals/tools/make_cases.py from answer-keys/valentinyeo.com.subtle.json. Do not edit by hand.
schema_version: "1.1"
name: defects-valentinyeo.com.subtle
description: Find 5 planted subtle conversion defects on a snapshot of valentinyeo.com. Score = share found.
tags: [defects, subtle]
runs: 3
context:
  scaffold_script: setup.sh
execution:
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: "The landing page of valentinyeo.com is saved as index.html in the current folder (a snapshot: the live site is not reachable from here, so do not fetch it). Do a conversion review of this page: find what stops visitors from signing up or buying. For each problem, quote the exact text from the page that shows it.\n\nEnd your answer with one JSON code block: a list of objects {\"problem\": \"...\", \"quote\": \"exact text copied from the page\"}, most serious first.\n"
graders:
  - name: placeholder-labels
    type: regex
    flags: i
    pattern: "placeholder[^\\n]{0,120}label|label[^\\n]{0,120}placeholder|unlabell?ed|no visible label"
  - name: unsupported-claim
    type: regex
    flags: i
    pattern: "10,000\\+? teams"
  - name: prechecked-consent
    type: regex
    flags: i
    pattern: "pre-?(checked|ticked|selected)|checked by default|ticked by default|partner offers|offers from our partners"
  - name: hidden-fee
    type: regex
    flags: i
    pattern: "\\$25|setup fee"
  - name: guarantee-conflict
    type: regex
    flags: i
    pattern: "^(?=[\\s\\S]*(money-back|30-day))(?=[\\s\\S]*all sales are final)"
  - name: pack-used
    type: tool_used
    tool: Skill
    arm: with-only
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?cro'
