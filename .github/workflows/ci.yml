name: CI
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python tests/lint_skills.py
      - run: python -m unittest discover -s tests -p "test_*.py" -v
      - run: python -m compileall -q skills/cro/scripts
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Planted, subtle and blind fixtures, answer keys and cases are up to date
        run: |
          python evals/tools/plant.py --check
          python evals/tools/make_cases.py --check
          python evals/tools/make_winner.py --check
          python evals/tools/check.py answer-keys
          python evals/tools/check.py fixtures
      - name: Committed eval results recompute and stay above the score floor
        run: python evals/tools/check.py results
  install-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: bash tests/smoke_install.sh
      - run: bash install.sh
      - run: bash tests/e2e_synthetic.sh
